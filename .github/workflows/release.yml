name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/ks/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package APK
        id: pkg
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/PinCatcher-${{ github.ref_name }}.apk
          sha256sum dist/*.apk > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PinCatcher-${{ github.ref_name }}.apk
            dist/SHA256SUMS
          generate_release_notes: true
