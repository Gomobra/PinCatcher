# Sized for the on-device build host. CI runners have far more; bump there if
# assembleRelease starts swapping.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

# Dependency fetches over mobile/USB networking drop regularly. Give Gradle
# enough room to retry instead of failing the whole build on one blip.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.retry.max=8

android.useAndroidX=true
android.nonTransitiveRClass=true

# aapt2 override. AGP resolves aapt2 from Maven as a linux-x86_64 ELF, which
# cannot execute on Android/arm64. Termux ships a native aarch64 build
# (`pkg install aapt2`), so point AGP at it. Delete this line on a normal
# x86_64 development host or in CI - there the Maven artifact is correct.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

kotlin.code.style=official
